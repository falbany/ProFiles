[build-system]
requires = ["hatchling", "hatch-vcs", "nodeenv>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "profiles-app"
dynamic = ["version"]
description = "ProFiles - A modern GUI launcher for production test programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.1.0",
    "sse-starlette>=2.1.0",
    "qrcode[pil]>=7.5.0",
    "zxing-cpp>=2.2.0",
    "ruamel.yaml>=0.18.0",
]
license = "MIT"
license-files = ["LICENCE"]
authors = [
    {name = "Florent ALBANY", email = "florent.albany@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Manufacturing",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/falbany/profiles"
Repository = "https://github.com/falbany/profiles.git"

[project.scripts]
ProFiles = "profiles.app:main"
profiles = "profiles.app:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "pyright>=1.1.0",
    "deptry>=0.22.0",
    "httpx>=0.27.0",
    "briefcase>=0.4.4",
    # Declared so `pyright src/profiles` can resolve the build-hook import
    # (web/build_hook.py); also what deptry needs (#43).
    "hatchling>=1.26",
]

[tool.hatch.build.hooks.custom]
path = "src/profiles/web/build_hook.py"

[tool.hatch.build.targets.wheel]
packages = ["src/profiles"]
artifacts = ["src/profiles/web/dist"]

# ============================================
# Briefcase — native installer config
# ============================================
# Note: the app version is deliberately NOT repeated here. The git tag is
# the single source of truth: hatch-vcs derives the version from it at
# build time, and Briefcase picks it up via the PEP 621 metadata merge
# (merge_pep621_config in briefcase.config).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0-dev"

[tool.hatch.build.hooks.vcs]
version-file = "src/profiles/_version.py"
[tool.briefcase]
project_name = "ProFiles"
bundle = "com.github.falbany"
url = "https://github.com/falbany/profiles"
license = "MIT"
author = "Falbany Labs"
author_email = "florent.albany@gmail.com"

[tool.briefcase.app.profiles]
formal_name = "ProFiles"
description = "A modern GUI launcher for production test programs"
# Required by the Debian (deb/system) backend for the package control file.
long_description = """ProFiles is a modern GUI launcher for production test programs.

It scans configured directories for test program files, lets operators
browse, filter and launch them with a double-click, and supports
per-machine configuration, launch hooks, telemetry, and a modern
web-based (React) interface packaged as a native desktop app."""
icon = "img/profiles"
sources = ["src/profiles"]
# Runtime dependencies installed into the Briefcase bundle. Must mirror
# [project].dependencies.
# proxy_tools is vendored as a local wheel because pywebview depends on it,
# it ships only an sdist on PyPI, and Briefcase installs macOS requirements
# with `--only-binary :all:` (universal py3-none-any wheel; see
# packaging/wheels/README.md for provenance).
requires = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.1.0",
    "sse-starlette>=2.1.0",
    "qrcode[pil]>=7.5.0",
    "zxing-cpp>=2.2.0",
    "ruamel.yaml>=0.18.0",
    "packaging/wheels/proxy_tools-0.1.0-py3-none-any.whl",
]

# Declared so that a Briefcase build registers ``*.profiles`` (e.g.
# ``my.profiles``) as a ProFiles document on every platform: Info.plist
# document types on macOS, the registry on Windows, .desktop MIME on Linux.
# Briefcase 0.4.x binds the SINGULAR ``document_type`` table (the plural
# ``document_types`` key is absorbed by **kwargs and overwritten with {}),
# and each entry requires extension/icon/description/url. The literal
# dotfile ``.profiles`` is not claimable (no filename extension to match).
[tool.briefcase.app.profiles.document_type.profiles]
extension = "profiles"
description = "ProFiles launch-handoff document"
icon = "img/profiles"
url = "https://github.com/falbany/profiles"

[tool.briefcase.app.profiles.document_type.profiles.macOS]
CFBundleTypeRole = "Editor"
LSHandlerRank = "Owner"

# Cross-platform permission declarations. Without the camera entry, macOS
# ships the app WITHOUT NSCameraUsageDescription and WebKit then refuses to
# expose navigator.mediaDevices entirely — the camera barcode scanner fails
# with "Camera access is not supported". See issue #15.
[tool.briefcase.app.profiles.permission]
camera = "ProFiles uses the camera to scan configuration barcodes and QR codes."

# Windows MSI polish (issue #183). Briefcase 0.4.x dropped the MSI reference
# docs; every option below is verified against the 0.4.7 source and its WiX
# template — see docs/superpowers/specs/2026-11-17-windows-installer-polish-design.md.
#
# system_installer is deliberately UNSET: the wizard then asks per-user vs
# per-machine at install time ("perUserOrMachine" install scope).
[tool.briefcase.app.profiles.windows]
create_desktop_shortcut = true
# Briefcase resolves these with_suffix(".bmp") against the project root —
# the committed files must be BMPs (img/installer_*.bmp), sizes are fixed
# by WiX (493x312 dialog / 493x58 banner) and pinned by tests/packaging.
installer_background = "img/installer_background"
installer_banner = "img/installer_banner"
# Finish page: checked "Launch ProFiles" box + links + completion text.
installer_completion_launch_app = true
installer_completion_text = """\
ProFiles has been installed successfully. Launch it now, or find it in \
your Start Menu."""
uninstaller_completion_text = """\
ProFiles has been removed. Your configurations and logs were left \
untouched."""
installer_completion_urls = [
    { title = "Documentation", url = "https://github.com/falbany/ProFiles#readme" },
    { title = "What's new", url = "https://github.com/falbany/ProFiles/blob/main/CHANGELOG.md" },
]
# PATH convenience: bundled scripts (packaging/windows/) do the registry
# work — the WiX template's native PATH feature is console-app-only.
post_install_script = "packaging/windows/post_install.bat"
pre_uninstall_script = "packaging/windows/pre_uninstall.bat"

# NOTE: singular `install_option`, array of tables, each entry REQUIRES
# `name`. The plural `install_options` key is absorbed by **kwargs and
# overwritten in DraftAppConfig — the same trap as `document_type` above.
[[tool.briefcase.app.profiles.windows.install_option]]
name = "add_to_path"
title = "Add ProFiles to PATH"
description = "Run 'profiles' (including --headless automation) from any terminal."
default = true

[tool.pylint.MASTER]
init-import = "yes"
ignore-paths = ["src/profiles/_version.py"]
max-line-length = 100
output-format = "colorized"
reports = false

[tool.pylint.IMPORTS]
ignored-classes = ["profiles"]

[tool.pylint.TYPECHECK]
ignored-modules = ["zxingcpp", "WebKit"]

[tool.pylint."MESSAGES CONTROL"]
disable = "C0114,C0115,C0116,C0301,C0103,R0902,R0903,R0917,W0603,W0718,R0801,R1705,C0415,E0401,E0611"
# R0903: too-few-public-methods - acceptable for single-purpose classes
# R0902: too-many-instance-attributes - required for GUI classes
# R0917: too-many-positional-arguments - constructor needs many params
# W0603: global-statement - used for module-level singleton pattern
# W0718: broad-exception-caught - generic catch for GUI robustness
# R1705: no-else-return - already fixed
# C0415: import-outside-toplevel - acceptable for dynamic imports
# E0401: import-error - false positive for dynamic sys.path modifications
# E0611: no-name-in-module - false positive for dynamic imports
"good-names" = [
    "i", "j", "k", "x", "y", "z",
    "_DEFAULT_LOGGER",
]

[tool.pylint.DESIGN]
max-args = 8
max-attributes = 15
max-locals = 20
max-branches = 15
max-module-lines = 1200
max-statements = 60

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
    "--cov=src/profiles",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    # Opt a test out of pytest-qt's sys.excepthook capture (used by tests that
    # exercise install_crash_hook, which route exceptions through the hook).
    "qt_no_exception_capture: disable pytest-qt exception capture for this test",
]

# Type checking gate (issue #69): `pyright src/profiles` must stay clean.
# Basic mode on purpose — the gate is regression insurance, not strict-mode.
[tool.pyright]
include = ["src/profiles"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "pyright>=1.1.0",
    "deptry>=0.22.0",
    "httpx>=0.27.0",
    "briefcase>=0.4.4",
    # Declared so `pyright src/profiles` can resolve the build-hook import
    # (web/build_hook.py); also what deptry needs (#43).
    "hatchling>=1.26",
]
