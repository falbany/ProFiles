[build-system]
requires = ["hatchling", "nodeenv>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "profiles-app"
version = "0.9.0"
description = "ProFiles - A modern GUI launcher for production test programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.1.0",
    "sse-starlette>=2.1.0",
    "qrcode[pil]>=7.5.0",
    "ruamel.yaml>=0.18.0",
]
license = "MIT"
authors = [
    {name = "Florent ALBANY", email = "florent.albany@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Manufacturing",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/falbany/profiles"
Repository = "https://github.com/falbany/profiles.git"

[project.scripts]
ProFiles = "profiles.app:main"
profiles = "profiles.app:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "pyright>=1.1.0",
    "deptry>=0.22.0",
    "httpx>=0.27.0",
    "briefcase>=0.4.4",
    # Tkinter frontend (deprecated, developer use only; see 2026-10-23-native-installer-design.md)
    "sv-ttk>=2.5.0",
    "darkdetect>=0.8.0",
]

[tool.hatch.build.hooks.custom]
path = "src/profiles/web/build_hook.py"

[tool.hatch.build.targets.wheel]
packages = ["src/profiles"]
artifacts = ["src/profiles/web/dist"]

[tool.hatch.build.targets.wheel.force-include]
"src/profiles" = "profiles_app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["profiles", "profiles.*"]

# ============================================
# Briefcase — native installer config
# ============================================
# See docs/superpowers/specs/2026-09-01-briefcase-installer-design.md
# Note: the app version is deliberately NOT repeated here. Briefcase
# merges PEP 621 metadata (merge_pep621_config in briefcase.config), so
# [project].version above is the single source of truth for installers.
[tool.briefcase]
project_name = "ProFiles"
bundle = "com.github.falbany"
url = "https://github.com/falbany/profiles"
license = "MIT"
author = "Florent ALBANY"
author_email = "florent.albany@gmail.com"

[tool.briefcase.app.profiles]
formal_name = "ProFiles"
description = "A modern GUI launcher for production test programs"
icon = "img/profiles"
sources = ["src/profiles"]
# Runtime dependencies installed into the Briefcase bundle. Must mirror
# [project].dependencies minus the deprecated Tk extras (sv-ttk, darkdetect).
# proxy_tools is vendored as a local wheel because pywebview depends on it,
# it ships only an sdist on PyPI, and Briefcase installs macOS requirements
# with `--only-binary :all:` (universal py3-none-any wheel; see
# packaging/wheels/README.md for provenance).
requires = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.1.0",
    "sse-starlette>=2.1.0",
    "qrcode[pil]>=7.5.0",
    "ruamel.yaml>=0.18.0",
    "packaging/wheels/proxy_tools-0.1.0-py3-none-any.whl",
]

# Declared so that a Briefcase build registers ``*.profiles`` (e.g.
# ``my.profiles``) as a ProFiles document on every platform: Info.plist
# document types on macOS, the registry on Windows, .desktop MIME on Linux.
# Briefcase 0.4.x binds the SINGULAR ``document_type`` table (the plural
# ``document_types`` key is absorbed by **kwargs and overwritten with {}),
# and each entry requires extension/icon/description/url. The literal
# dotfile ``.profiles`` is not claimable (no filename extension to match).
# See docs/superpowers/specs/2026-10-13-launch-and-config-handoff-design.md
[tool.briefcase.app.profiles.document_type.profiles]
extension = "profiles"
description = "ProFiles launch-handoff document"
icon = "img/profiles"
url = "https://github.com/falbany/profiles"

[tool.briefcase.app.profiles.document_type.profiles.macOS]
CFBundleTypeRole = "Editor"
LSHandlerRank = "Owner"

[tool.pylint.MASTER]
init-import = "yes"
max-line-length = 100
output-format = "colorized"
reports = false

[tool.pylint.IMPORTS]
ignored-classes = ["profiles"]

[tool.pylint.TYPECHECK]
ignored-modules = ["profiles.utils.shortcut"]

[tool.pylint."MESSAGES CONTROL"]
disable = "C0114,C0115,C0116,C0301,C0103,R0902,R0903,R0917,W0603,W0718,R0801,R1705,C0415,E0401,E0611"
# R0903: too-few-public-methods - acceptable for single-purpose classes
# R0902: too-many-instance-attributes - required for GUI classes
# R0917: too-many-positional-arguments - constructor needs many params
# W0603: global-statement - used for module-level singleton pattern
# W0718: broad-exception-caught - generic catch for GUI robustness
# R1705: no-else-return - already fixed
# C0415: import-outside-toplevel - acceptable for dynamic imports
# E0401: import-error - false positive for dynamic sys.path modifications
# E0611: no-name-in-module - false positive for dynamic imports
"good-names" = [
    "i", "j", "k", "x", "y", "z",
    "_DEFAULT_LOGGER",
]

[tool.pylint.DESIGN]
max-args = 8
max-attributes = 15
max-locals = 20
max-branches = 15
max-module-lines = 1200
max-statements = 60

[tool.setuptools.package-data]
"profiles" = ["py.typed"]
# The React/Vite frontend is built with `npm run build` (see src/profiles/web)
# and the resulting dist/ is committed to the repository so that
# `pip install .` yields a working app without needing a Node.js toolchain.
"profiles.web" = ["dist/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = [
    "--cov=src/profiles",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    # Opt a test out of pytest-qt's sys.excepthook capture (used by tests that
    # exercise install_crash_hook, which route exceptions through the hook).
    "qt_no_exception_capture: disable pytest-qt exception capture for this test",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "pyright>=1.1.0",
    "deptry>=0.22.0",
    "httpx>=0.27.0",
    "briefcase>=0.4.4",
    # Tkinter frontend (deprecated, developer use only; see 2026-10-23-native-installer-design.md)
    "sv-ttk>=2.5.0",
    "darkdetect>=0.8.0",
]
