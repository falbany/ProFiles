name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version from tags: full history required
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies (Python 3.13, matches the dev environment)
        run: uv sync --locked --python 3.13

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Pylint (score >= 8.0)
        run: uv run pylint src/profiles --fail-under=8.0

      - name: Pyright (type check)
        run: uv run pyright src/profiles

      - name: Tests with coverage (>= 85%)
        run: uv run pytest --cov=src/profiles --cov-report=xml --cov-fail-under=85

  web:
    name: Web front-end (build & tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/profiles/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/profiles/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Vitest
        run: npm run test
