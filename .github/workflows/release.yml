name: Release native installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag is SemVer and matches [project].version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["TAG_VERSION"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              sys.exit(f"Tag {tag!r} is not SemVer (expected vMAJOR.MINOR.PATCH[...])")

          data = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project = data["project"]["version"]
          version = tag.removeprefix("v")
          assert version == project, (
              f"Version mismatch: tag={version!r} pyproject={project!r}"
          )
          print(f"Version guard OK: {version}")
          PY

  windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Pin the sync interpreter: briefcase embeds the running Python's
      # major.minor into the bundle, and 3.15 (the newest interpreter
      # satisfying requires-python) has no wheels yet for some binary
      # dependencies (e.g. uvloop on macOS).
      - run: uv sync --python 3.13 --locked
      - run: uv run briefcase package windows -p msi --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/**/*.msi
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --locked
      # --no-input: CI has no TTY; without it briefcase prompts for a
      # signing identity and aborts. It auto-selects ad-hoc signing.
      - run: uv run briefcase package macos -p dmg --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/**/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # ubuntu-24.04 runners ship without libfuse2, which the linuxdeploy /
      # AppImage packaging tooling needs to execute.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse2
      # The deb (system) backend requires briefcase to run under the
      # system python3 — pin the sync interpreter to it. Briefcase 0.4.x
      # takes the output format as a positional argument.
      - run: uv sync --python /usr/bin/python3 --locked
      - run: uv run briefcase package linux deb --no-input
      # No `briefcase upgrade linuxdeploy`: on a fresh runner linuxdeploy
      # is not yet a managed install, so `upgrade` exits 200. The package
      # step downloads the linuxdeploy it needs on demand.
      - run: uv run briefcase package linux appimage --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: |
            dist/**/*.deb
            dist/**/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -exec sha256sum {} + > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Tags with a pre-release suffix (e.g. v1.0.0-rc.1) publish as
          # pre-releases; plain vX.Y.Z tags publish as full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
