name: Windows packaging dry-run

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "img/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13 --locked
      # Exercise the same packaging command as release.yml so MSI/WiX
      # breakage is caught on PRs, not at tag time.
      - run: uv run briefcase package windows -p msi --no-input
      # The MSI is the only artifact: release.yml ships installers only,
      # and briefcase never produces an unpacked bundle under windows/.
      - uses: actions/upload-artifact@v4
        with:
          name: ProFiles-windows-msi
          path: dist/**/*.msi
          if-no-files-found: error
          retention-days: 7
