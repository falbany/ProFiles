name: ✨ Feature request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Please focus on the **problem to
        solve** first — the best solution often comes after discussion.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? What is missing today?
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use cases / evidence
      description: Concrete use cases. "I often need to…" is great evidence; include workflow examples if possible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Describe the behavior, not necessarily the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or considered, and why they fall short.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: "Where should this change live? (helps route the review)"
      options:
        - label: "Web UI (src/profiles/web)"
        - label: "Python backend / core (src/profiles/core, server, …)"
        - label: "Configuration format (.profiles.yaml)"
        - label: Documentation
        - label: Packaging / CI

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues (open and closed) for this feature
        - label: This does not conflict with an open PR implementing the same thing
    validations:
      required: true
