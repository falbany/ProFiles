<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768">
  <!-- Concept 1 — Badge Left: dark backdrop, app mark left, wordmark right -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1408" height="768" fill="#0d1017"/>

  <!-- ghost bars, bottom-right corner -->
  <g fill="#ffffff" opacity="0.04">
    <rect x="1070" y="628" width="280" height="56" rx="28"/>
    <rect x="1070" y="706" width="280" height="56" rx="28"/>
  </g>

  <!-- app mark -->
  <g transform="translate(140 224)">
    <rect width="320" height="320" rx="60" fill="#4f46e5"/>
    <rect x="80" y="80"  width="160" height="30" fill="#ffffff"/>
    <rect x="80" y="140" width="160" height="30" fill="#ffffff"/>
    <rect x="80" y="200" width="100" height="30" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="540" y="420" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="150" font-weight="700" letter-spacing="-3" fill="#ffffff">ProFiles</text>

  <!-- accent underline -->
  <rect x="546" y="462" width="220" height="10" rx="5" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="546" y="548" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="32" fill="#9aa3b2">A modern GUI launcher for production test programs</text>
</svg>
