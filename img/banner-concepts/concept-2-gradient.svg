<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="768" viewBox="0 0 1408 768">
  <!-- Concept 2 — Gradient Hero: indigo→violet wash, centered wordmark, bar watermark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1408" height="768" fill="url(#bg)"/>

  <!-- oversized translucent bars, right side -->
  <g fill="#ffffff" opacity="0.12">
    <rect x="1000" y="150" width="330" height="66" rx="33"/>
    <rect x="1000" y="255" width="330" height="66" rx="33"/>
    <rect x="1000" y="360" width="205" height="66" rx="33"/>
  </g>
  <!-- soft top glow band -->
  <rect width="1408" height="220" fill="url(#glow)"/>

  <!-- app mark, centered -->
  <g transform="translate(624 130)">
    <rect width="160" height="160" rx="30" fill="#ffffff" opacity="0.96"/>
    <rect x="40" y="40" width="80" height="15" fill="#4f46e5"/>
    <rect x="40" y="70" width="80" height="15" fill="#4f46e5"/>
    <rect x="40" y="100" width="50" height="15" fill="#4f46e5"/>
  </g>

  <!-- wordmark -->
  <text x="704" y="500" text-anchor="middle"
        font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="160" font-weight="700" letter-spacing="-4" fill="#ffffff">ProFiles</text>

  <!-- tagline -->
  <text x="704" y="575" text-anchor="middle"
        font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="40" fill="#ffffff" opacity="0.85">The Highly Configurable, Multi-Purpose File Launcher</text>
</svg>
